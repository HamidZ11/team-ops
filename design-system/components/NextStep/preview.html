<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>NextStep — preview</title>

</head>
<body>
<div id="root" class="mr-root"></div>
<script>
  var M = window.Meridian, h = React.createElement;
  function row() { return h.apply(null, ["div", { className: "row" }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    h("div", { style: { display: "flex", flexDirection: "column", gap: 12, maxWidth: 586 } },

      h(M.NextStep, { status: "in_review", emphasis: true, title: "Your approval is needed", meta: "Submitted 2h ago", body: "Lena submitted this for approval.",
        actions: [h(M.Button, { key: "a", variant: "primary" }, "Approve"), h(M.Button, { key: "r" }, "Request changes")] }),
      h(M.NextStep, { tone: "danger", icon: "ban", title: "Blocked", meta: "yesterday at 09:20 · Noah", body: h("span", { style: { color: "var(--color-fg)" } }, "Waiting on the updated SOC 2 Type II report from the auditor."),
        actions: h(M.Button, null, h(M.Icon, { name: "rotate-ccw", size: 14 }), "Unblock") }),
      h(M.NextStep, { status: "in_progress", title: "Waiting for Daniel to start" }))
