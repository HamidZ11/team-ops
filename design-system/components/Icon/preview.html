<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Icon — preview</title>

<div id="root" class="mr-root"></div>

  var M = window.Meridian, h = React.createElement;
  function row() { return h.apply(null, ["div", { className: "row" }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,

        return h("span", { key: n, title: n, style: { display: "flex", flexDirection: "column", alignItems: "center", gap: 6, color: "var(--color-fg-2)" } },
          h(M.Icon, { name: n, size: 16 }), h("span", { className: "text-micro", style: { color: "var(--color-fg-3)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", maxWidth: 72 } }, n));
      }))
