<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Avatar — preview</title>
<style>body{margin:0;background:var(--color-canvas)} #root{padding:16px} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .row+.row{margin-top:12px}</style>
</head>
<body>
<div id="root" class="mr-root"></div>
<script>
  var M = window.Meridian, h = React.createElement;
  function row() { return h.apply(null, ["div", { className: "row" }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    row(
      h(M.Avatar, { name: "Priya Nair", size: 32 }),
      h(M.Avatar, { name: "Daniel Okafor", size: 28 }),
      h(M.Avatar, { name: "Lena Fischer", size: 24 }),
      h(M.Avatar, { name: "Tomás Lindqvist", size: 20 }),
      h(M.Avatar, { name: "Aiko Tanaka", size: 18 }),
      h(M.Avatar, { name: null, size: 20, decorative: false }),
      h("span", { style: { width: 16 } }),
      h(M.AvatarStack, { names: ["Sam Whitfield", "Noah Adeyemi", "Inès Moreau"] })
    )
  ));
</script>
</body>
</html>
