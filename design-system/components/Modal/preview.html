<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Modal — preview</title>

<div id="root" class="mr-root"></div>

  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    h(M.Modal, { title: "New request", footer: [h(M.Button, { key: "c", variant: "ghost" }, "Cancel"), h(M.Button, { key: "s", variant: "primary" }, "Create request")] },

  ));
