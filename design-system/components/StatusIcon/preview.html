<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>StatusIcon — preview</title>
<style>body{margin:0;background:var(--color-canvas)} #root{padding:16px} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .row+.row{margin-top:12px}</style>
</head>
<body>
<div id="root" class="mr-root"></div>
<script>
  var M = window.Meridian, h = React.createElement;
  function row() { return h.apply(null, ["div", { className: "row" }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    row.apply(null, ["triage", "todo", "in_progress", "in_review", "done", "declined"].map(function (s) {
      return h("span", { key: s, style: { display: "inline-flex", flexDirection: "column", alignItems: "center", gap: 8, width: 76 } },
        h(M.StatusIcon, { status: s, size: 20 }),
        h("span", { className: "text-meta", style: { color: "var(--color-fg-3)" } }, M.STATUS_META[s].label));
    }))
  ));
</script>
</body>
</html>
