<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Tabs — preview</title>
<style>body{margin:0;background:var(--color-canvas)} #root{padding:16px} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .row+.row{margin-top:12px}</style>
</head>
<body>
<div id="root" class="mr-root"></div>
<script>
  var M = window.Meridian, h = React.createElement;
  function row() { return h.apply(null, ["div", { className: "row" }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    h("div", { style: { background: "var(--color-shell)", borderRadius: 12, border: "1px solid var(--color-line)", padding: 4 } },
      h(M.Tabs, { tabs: [
        { id: "all", label: "All", count: 48 }, { id: "triage", status: "triage", count: 5 }, { id: "todo", status: "todo", count: 9 },
        { id: "in_progress", status: "in_progress", count: 14 }, { id: "in_review", status: "in_review", count: 6 }, { id: "done", status: "done", count: 14 }
      ] }))
  ));
</script>
</body>
</html>
