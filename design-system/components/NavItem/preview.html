<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>NavItem — preview</title>
<style>body{margin:0;background:var(--color-canvas)} #root{padding:12px 16px} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .row+.row{margin-top:12px}</style>
</head>
<body>
<div id="root" class="mr-root"></div>
<script>
  var M = window.Meridian, h = React.createElement;
  function row() { return h.apply(null, ["div", { className: "row" }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    h("div", { className: "mr-root", style: { width: 220, background: "var(--color-canvas)" } },
      h("div", { className: "mr-nav" },
        h(M.NavItem, { icon: "inbox", label: "Inbox", unread: 4 }),
        h(M.NavItem, { icon: "circle-user-round", label: "My work", count: 6, active: true }),
        h(M.NavItem, { icon: "stamp", label: "Approvals", count: 2 })),
      h("p", { className: "mr-nav-label text-meta" }, "Views"),
      h("div", { className: "mr-nav" },
        h(M.NavItem, { icon: "layers", label: "All requests", count: 48 }),
        h(M.NavItem, { icon: "ban", label: "Blocked", count: 3 }),
        h(M.NavItem, { icon: "calendar-clock", label: "Due this week", count: 7 }))
    )
  ));
</script>
</body>
</html>
