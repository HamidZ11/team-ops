<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>PriorityIcon — preview</title>
<style>body{margin:0;background:var(--color-canvas)} #root{padding:16px} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .row+.row{margin-top:12px}</style>
</head>
<body>
<div id="root" class="mr-root"></div>
<script>
  var M = window.Meridian, h = React.createElement;
  function row() { return h.apply(null, ["div", { className: "row" }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    row.apply(null, ["urgent", "high", "medium", "low", "none"].map(function (p) {
      return h("span", { key: p, style: { display: "inline-flex", alignItems: "center", gap: 8, width: 110 } },
        h(M.PriorityIcon, { priority: p }), h("span", { className: "text-ui", style: { color: p === "none" ? "var(--color-fg-3)" : "var(--color-fg)" } }, M.PRIORITY_META[p].label));
    }))
  ));
</script>
</body>
</html>
