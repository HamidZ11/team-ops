<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Button — preview</title>
<style>body{margin:0;background:var(--color-canvas)} #root{padding:16px} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .row+.row{margin-top:12px}</style>
</head>
<body>
<div id="root" class="mr-root"></div>
<script>
  var M = window.Meridian, h = React.createElement;
  function row() { return h.apply(null, ["div", { className: "row" }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    row(
      h(M.Button, { variant: "primary" }, "Accept"),
      h(M.Button, null, "Assign owner"),
      h(M.Button, { variant: "ghost" }, "Cancel"),
      h(M.Button, { variant: "danger" }, "Decline"),
      h(M.Button, { disabled: true }, "Comment")
    ),
    row(
      h(M.Button, { variant: "primary", size: "md" }, h(M.Icon, { name: "plus", size: 14 }), "New request"),
      h(M.Button, { size: "md" }, "Request changes"),
      h(M.Button, { variant: "ghost", size: "icon-sm", "aria-label": "Close" }, h(M.Icon, { name: "x", size: 16 })),
      h(M.Button, { size: "icon-md", "aria-label": "Hide sidebar" }, h(M.Icon, { name: "panel-left-close", size: 16 }))
    )
  ));
</script>
</body>
</html>
