<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Timeline — preview</title>
<style>body{margin:0;background:var(--color-canvas)} #root{padding:16px} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .row+.row{margin-top:12px}</style>
</head>
<body>
<div id="root" class="mr-root"></div>
<script>
  var M = window.Meridian, h = React.createElement;
  function row() { return h.apply(null, ["div", { className: "row" }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    h("div", { style: { maxWidth: 586 } }, h(M.Timeline, { items: [
      { kind: "event", actor: "Priya Nair", text: "accepted it · owner Daniel Okafor · approval Lena Fischer", icon: "user-round-check", at: "3d ago" },
      { kind: "comment", author: "Daniel Okafor", at: "2d ago", body: "MacBook Air M3 ordered from the usual supplier. @Aiko which keyboard layout do you want?" },
      { kind: "event", actor: "Daniel Okafor", text: "started work", icon: h(M.StatusIcon, { status: "in_progress", size: 12 }), at: "2d ago" },
      { kind: "event", actor: "Lena Fischer", text: "requested changes", icon: "corner-up-left", iconColor: "var(--color-st-review)", at: "1d ago", note: "Please attach the quote before I approve." },
      { kind: "event", actor: "Daniel Okafor", text: "marked it blocked", note: "Waiting on the supplier to confirm stock.", icon: "ban", iconColor: "var(--color-danger-fg)", at: "4h ago" }
    ] }))
  ));
</script>
</body>
</html>
