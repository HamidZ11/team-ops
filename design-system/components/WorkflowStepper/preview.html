<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>WorkflowStepper — preview</title>
<style>body{margin:0;background:var(--color-canvas)} #root{padding:20px 16px} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .row+.row{margin-top:12px}</style>
</head>
<body>
<div id="root" class="mr-root"></div>
<script>
  var M = window.Meridian, h = React.createElement;
  function row() { return h.apply(null, ["div", { className: "row" }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    h("div", { style: { display: "flex", flexDirection: "column", gap: 22, maxWidth: 640 } },
      h(M.WorkflowStepper, { status: "triage" }),
      h(M.WorkflowStepper, { status: "in_progress", blocked: true }),
      h(M.WorkflowStepper, { status: "in_review" }),
      h(M.WorkflowStepper, { status: "done", needsApproval: false }),
      h(M.WorkflowStepper, { status: "declined" }))
  ));
</script>
</body>
</html>
